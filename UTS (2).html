<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Faris Pratista Febriano</title>
  <meta name="description" content="Project and experience of Faris Pratista Febriano.">
  <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon">
  <meta name="theme-color" content="#001233">
  <link rel="preload" href="Font/Rodin Pro EB.otf" as="font" type="font/otf" crossorigin>
  <script>if (sessionStorage.getItem("p3r-transition")) document.documentElement.classList.add("is-incoming");</script>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="project">
  <div class="mobile-warning">
    <p>Sorry, this website is not supported for your device.</p>
    <p>Try viewing this site on a computer!</p>
  </div>

  <div id="page-cover" class="page-cover" aria-hidden="true"></div>

  <section id="project-page" class="p3r-slink-screen active" role="region" aria-label="Projects Social Link Screen">
    <div class="slink-video-container" aria-hidden="true">
      <video id="slink-bg-video" class="slink-bg-video" loop muted playsinline preload="none">
        <source src="vidio/skills-bg.mp4" type="video/mp4">
      </video>
      <div class="slink-video-overlay" aria-hidden="true"></div>
    </div>

    <div class="slink-viewport">
      <div class="slink-left-column">
        <div class="slink-profile-header" aria-hidden="true">
          <div class="slink-profile-name">FARIS PRATISTA FEBRIANO</div>
        </div>
        <div class="p3r-geometric-header" id="slink-project-div">
          <div class="p3r-shard-back-band" aria-hidden="true"></div>
          <div class="p3r-header-slash-main" aria-hidden="true"></div>
          <h1 class="p3r-banner-title">PROJECT</h1>
        </div>
        <div id="slink-cards-container" class="slink-cards-container" role="tablist" aria-label="Project List"></div>
      </div>

      <div class="slink-bottom-hud">
        <div class="buttons-row">
          <button id="slink-confirm-btn" class="control-item slink-hud-btn" aria-label="Confirm Selection">
            <div class="control-key">ENTER</div>
            <span class="control-text">Confirm</span>
          </button>
          <button id="slink-back-btn" class="control-item slink-hud-btn" aria-label="Back to Main Menu">
            <div class="control-key">ESC</div>
            <span class="control-text">Back</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <audio id="sfx-navigation-el" src="lagu/navigation.wav" preload="auto"></audio>
  <audio id="sfx-close-menu-el" src="lagu/close-menu.mp3" preload="auto"></audio>
  <audio id="background-music" src="lagu/bg.mp3" preload="auto" loop></audio>
  <script src="interaction.js"></script>
</body>
</html>
